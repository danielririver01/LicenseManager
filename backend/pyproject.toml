[project]
name = "license-manager"
version = "0.1.0"
description = "License Manager de Frubber POS - emision offline de licencias FRB1 (ECDSA P-256)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.143",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["license_manager*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # Patrón idiomático de FastAPI: Form(...) / Query(...) como valor por defecto.
    "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
