{% extends "base.html" %}
{% block titulo %}Iniciar sesion · {{ app_name }}{% endblock %}

{% block cuerpo %}
<div class="centro">
  <div class="panel-login">
    <div class="marca-grande">
      <div class="nombre">License Manager</div>
      <div class="desc">Emision de licencias Frubber POS</div>
    </div>

    <div class="tarjeta">
      {% if error %}<div class="alerta alerta-error">{{ error }}</div>{% endif %}

      <form method="post" action="/login">
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" required autofocus autocomplete="username">
        </div>
        <div class="campo">
          <label for="password">Contrasena</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primario btn-ancho">Entrar</button>
      </form>
    </div>

    <p class="pista" style="text-align:center;margin-top:18px">
      Acceso solo para el Titular y los administradores autorizados.
    </p>
  </div>
</div>
{% endblock %}
